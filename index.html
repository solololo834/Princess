<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Princess Syakila</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    touch-action: manipulation;
  }
  #game {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: #1a0a12;
  }
  #bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity .6s ease;
  }
  #charWrap {
    position: absolute;
    bottom: 22%;
    left: 50%;
    width: 58%;
    transform: translateX(-50%);
    transition: left 2.6s linear, opacity .8s ease;
    opacity: 0;
    z-index: 5;
  }
  #charBob { width: 100%; }
  #charBob.walking { animation: bob .45s ease-in-out infinite; }
  #char {
    width: 100%;
    display: block;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
    transition: transform .35s ease;
  }
  #char.flip { transform: scaleX(-1); }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-14px) rotate(1.5deg); }
  }
  #gift {
    position: absolute;
    width: 30%;
    left: 62%;
    bottom: 24%;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity .8s ease;
  }
  #gift.show { opacity: 1; }
  #gift.clickable { pointer-events: auto; cursor: pointer; animation: giftBounce 1s ease-in-out infinite; }
  #gift img { width: 100%; display: block; filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
  @keyframes giftBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-16px) scale(1.07); }
  }
  #clickHint {
    position: absolute;
    left: 0; right: 0;
    top: 14%;
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 12px #ff4fa3, 0 3px 0 #b3236b, 0 5px 10px rgba(0,0,0,.6);
    opacity: 0;
    transition: opacity .6s ease;
    z-index: 8;
    pointer-events: none;
  }
  #clickHint.show { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
  #dialog {
    position: absolute;
    left: 4%; right: 4%;
    bottom: 3%;
    min-height: 15%;
    padding: 26px 18px 16px;
    background: rgba(40, 10, 30, .88);
    border: 3px solid #ffd76a;
    border-radius: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
    color: #fff;
    z-index: 10;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  #dialog.show { opacity: 1; transform: translateY(0); }
  #nameTag {
    position: absolute;
    top: -17px; left: 16px;
    background: linear-gradient(135deg, #ff7ac0, #b44cff);
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    padding: 5px 16px;
    border-radius: 999px;
    border: 2px solid #ffd76a;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #dialogText {
    font-size: 21px;
    line-height: 1.4;
    min-height: 30px;
    text-align: left;
  }
  #dialogText.typing::after {
    content: '▍';
    margin-left: 2px;
    animation: blink .6s steps(1) infinite;
    color: #ffd76a;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #fade {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
    z-index: 20;
  }
  #loader {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 30%, #5a1840, #1a0612 75%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
    z-index: 30;
    transition: opacity .7s ease;
    padding: 30px;
    text-align: center;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader h1 {
    font-size: 30px;
    color: #ffd76a;
    text-shadow: 0 3px 10px rgba(0,0,0,.6);
  }
  #crown { font-size: 64px; animation: giftBounce 1.4s ease-in-out infinite; }
  #barWrap {
    width: 70%; height: 16px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    overflow: hidden;
    border: 2px solid #ffd76a;
  }
  #bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #ff7ac0, #ffd76a);
    transition: width .25s ease;
  }
  #loadText { color: #fff; font-size: 16px; }
  #playBtn {
    display: none;
    padding: 14px 52px;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(135deg, #ff5fae, #a64bff);
    border: 3px solid #ffd76a;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 20px rgba(255,95,174,.6);
    cursor: pointer;
    animation: pulse 1.1s ease-in-out infinite;
  }
  #playBtn:active { transform: scale(.94); }
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div>
  <div id="gift"><img id="giftImg" alt="Kado"></div>
  <div id="charWrap">
    <div id="charBob"><img id="char" alt="Princess Syakila"></div>
  </div>
  <div id="clickHint">Klik Kado!</div>
  <div id="dialog">
    <div id="nameTag">Princess Syakila</div>
    <div id="dialogText"></div>
  </div>
  <div id="fade"></div>
  <div id="loader">
    <div id="crown">🎁</div>
    <h1>Princess Syakila</h1>
    <div id="barWrap"><div id="bar"></div></div>
    <div id="loadText">Loading... 0%</div>
    <button id="playBtn">▶ PLAY</button>
  </div>
</div>
<script>
const IMG = {
  char: 'Sy.png',   
  gift: 'kado.png',   
  bg3:  'second.jpg',   
  bg4:  'First.jpg'    
};
const $ = id => document.getElementById(id);
const bg = $('bg'), charWrap = $('charWrap'), charBob = $('charBob'), charImg = $('char');
const gift = $('gift'), dialog = $('dialog'), dialogText = $('dialogText');
const fade = $('fade'), clickHint = $('clickHint');
const sleep = ms => new Promise(r => setTimeout(r, ms));
charImg.src = IMG.char;
$('giftImg').src = IMG.gift;
const files = Object.values(IMG);
let loaded = 0;
function onLoadOne() {
  loaded++;
  const pct = Math.round(loaded / files.length * 100);
  $('bar').style.width = pct + '%';
  $('loadText').textContent = 'Loading... ' + pct + '%';
  if (loaded >= files.length) {
    setTimeout(() => {
      $('loadText').textContent = 'Siap!';
      $('playBtn').style.display = 'block';
    }, 400);
  }
}
files.forEach(src => {
  const im = new Image();
  im.onload = im.onerror = onLoadOne;
  im.src = src;
});
async function say(text) {
  const parts = text.split(',').map(s => s.trim()).filter(Boolean);
  dialog.classList.add('show');
  await sleep(350);
  for (let i = 0; i < parts.length; i++) {
    const line = parts[i] + (i < parts.length - 1 ? ',' : '');
    dialogText.textContent = '';
    dialogText.classList.add('typing');
    for (const ch of line) {
      dialogText.textContent += ch;
      await sleep(55);
    }
    dialogText.classList.remove('typing');
    await sleep(i < parts.length - 1 ? 750 : 1200);
  }
}
function hideDialog() { dialog.classList.remove('show'); }
async function startStory() {
  bg.style.backgroundImage = `url('${IMG.bg4}')`;
  charWrap.style.transition = 'none';
  charWrap.style.left = '50%';
  void charWrap.offsetWidth;
  charWrap.style.transition = '';
  $('loader').classList.add('hide');
  await sleep(700);
  charWrap.style.opacity = 1;
  await sleep(900);
  await say('Jahat banget ihh, ga ada yang kasih aku kado, kan princess ultah, cek dulu ah');
  hideDialog();
  await sleep(400);
  charImg.classList.add('flip');
  await sleep(450);
  charBob.classList.add('walking');
  charWrap.style.left = '140%';
  await sleep(2700);
  charBob.classList.remove('walking');
  fade.style.opacity = 1;
  await sleep(1500);
  bg.style.backgroundImage = `url('${IMG.bg3}')`;
  charWrap.style.transition = 'none';
  charWrap.style.opacity = 0;
  charWrap.style.left = '30%';
  charImg.classList.remove('flip');
  void charWrap.offsetWidth;
  charWrap.style.transition = '';
  gift.classList.add('show');
  await sleep(2000);          
  fade.style.opacity = 0;
  await sleep(1200);
  charWrap.style.opacity = 1;
  await sleep(800);
  await say('Wah ada yang ngasih Kado!');
  hideDialog();
  await sleep(300);
  clickHint.classList.add('show');
  gift.classList.add('clickable');
}
$('playBtn').addEventListener('click', startStory);
gift.addEventListener('click', () => {
  if (!gift.classList.contains('clickable')) return;
  gift.classList.remove('clickable');
  clickHint.classList.remove('show');
  fade.style.transition = 'opacity .6s ease';
  fade.style.opacity = 1;
  setTimeout(() => { window.location.href = 'second.html'; }, 650);
});
</script>
</body>
  </html>
