<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Surat untuk Princess</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #scene {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #7a2252 0%, #3a0f2a 55%, #1a0612 100%);
  }
  .spark {
    position: absolute;
    color: #ffd76a;
    opacity: .7;
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.7);} 50% { opacity: .9; transform: scale(1.2);} }
  #hint {
    position: absolute;
    left: 0; right: 0;
    top: 16%;
    text-align: center;
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 12px #ff4fa3, 0 3px 0 #b3236b, 0 5px 10px rgba(0,0,0,.6);
    animation: pulse 1s ease-in-out infinite;
    transition: opacity .5s ease;
    pointer-events: none;
    z-index: 10;
  }
  #hint.gone { opacity: 0; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.12);} }
  #envelope {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 78%;
    aspect-ratio: 3 / 2;
    transform: translate(-50%, -50%);
    cursor: pointer;
    animation: floaty 2s ease-in-out infinite;
    z-index: 5;
  }
  #envelope.open { animation: none; cursor: default; }
  @keyframes floaty {
    0%,100% { transform: translate(-50%, -50%); }
    50%     { transform: translate(-50%, calc(-50% - 10px)); }
  }
  .env-back {
    position: absolute; inset: 0;
    background: #d9577f;
    border-radius: 10px;
    box-shadow: 0 14px 30px rgba(0,0,0,.55);
  }
  #paper {
    position: absolute;
    left: 7%; right: 7%;
    bottom: 6%;
    height: 88%;
    background: #fffaf0;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    z-index: 2;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 14px;
    transition: transform 1.2s cubic-bezier(.3,.9,.3,1), height 1.2s ease;
    overflow: hidden;
  }
  #paper span {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
    font-size: 0;
    color: #c2185b;
    line-height: 1.3;
    transition: font-size .6s ease .9s;
  }
  #envelope.open #paper {
    transform: translateY(-85%);
    height: 130%;
    z-index: 6;
  }
  #envelope.open #paper span { font-size: 30px; }
  .env-front {
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: 10px;
    overflow: hidden;
  }
  .env-front::before, .env-front::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 52%;
  }
  .env-front::before {
    left: 0;
    background: #e8698f;
    clip-path: polygon(0 0, 100% 55%, 0 100%);
  }
  .env-front::after {
    right: 0;
    background: #e8698f;
    clip-path: polygon(100% 0, 0 55%, 100% 100%);
  }
  .env-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    background: #f07ca0;
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
    z-index: 3;
    pointer-events: none;
    border-radius: 0 0 10px 10px;
  }
  .flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 58%;
    background: #c73e6a;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .8s ease, z-index 0s .4s;
    z-index: 4;
    border-radius: 10px 10px 0 0;
  }
  #envelope.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .seal {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    font-size: 34px;
    z-index: 5;
    transition: opacity .3s ease;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  #envelope.open .seal { opacity: 0; }
  #ending {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    text-align: center;
  }
  #ending.show { opacity: 1; pointer-events: auto; }
  #ending h1 {
    font-size: 72px;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 20px #ff4fa3;
    opacity: 0;
    transform: scale(.8);
    transition: opacity 1.5s ease 1.2s, transform 1.5s ease 1.2s;
  }
  #ending p {
    font-size: 15px;
    color: #ffd76a;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 1.5s ease 2.4s;
  }
  #ending.show h1 { opacity: 1; transform: scale(1); }
  #ending.show p  { opacity: 1; }
</style>
</head>
<body>
<div id="scene">
  <span class="spark" style="top:8%;left:12%;font-size:20px;">✦</span>
  <span class="spark" style="top:20%;left:82%;font-size:14px;animation-delay:.6s;">✦</span>
  <span class="spark" style="top:70%;left:8%;font-size:16px;animation-delay:1.1s;">✦</span>
  <span class="spark" style="top:82%;left:86%;font-size:22px;animation-delay:1.7s;">✦</span>
  <span class="spark" style="top:38%;left:90%;font-size:12px;animation-delay:.3s;">✦</span>
  <div id="hint">Buka Aku!</div>
  <div id="envelope">
    <div class="env-back"></div>
    <div id="paper"><span>Happy birthday Princess!</span></div>
    <div class="env-front"></div>
    <div class="env-bottom"></div>
    <div class="flap"></div>
    <div class="seal">🟠</div>
  </div>
  <div id="ending">
    <h1>Tamat</h1>
    <p>Happy Birthday Princess Syakila!</p>
  </div>
</div>
<audio id="hbd" src="hbd.mp3" loop preload="auto"></audio>
<script>
const envelope = document.getElementById('envelope');
const hint = document.getElementById('hint');
const ending = document.getElementById('ending');
const audio = document.getElementById('hbd');
let opened = false;
envelope.addEventListener('click', () => {
  if (opened) return;
  opened = true;
  hint.classList.add('gone');
  envelope.classList.add('open');
  audio.currentTime = 0;
  audio.volume = 1;
  audio.play().catch(() => {});
  setTimeout(() => {
    const fadeOut = setInterval(() => {
      if (audio.volume > 0.08) {
        audio.volume = Math.max(0, audio.volume - 0.08);
      } else {
        clearInterval(fadeOut);
        audio.pause();
        audio.currentTime = 0;
      }
    }, 80);
    ending.classList.add('show');
  }, 5000);
});
</script>
</body>
    </html>
